# Development setup. A separate production compose file comes with the deploy phase.
services:
  db:
    image: postgres:18-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - uploads:/data/uploads
      # Live code for --reload; rebuild the image only when dependencies change.
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
    command: >-
      sh -c "alembic upgrade head
      && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      # Live code for hot reload. Dependencies, index.html and vite.config.ts come from the
      # image: rebuild (docker compose up --build) after changing them.
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

volumes:
  db-data:
  uploads:
